<html><head><style>@font-face{font-family:M;src:url(fonts/martel-devanagari-800-normal.woff2)}body{margin:0}</style></head><body><canvas id=c width=1080 height=1920></canvas>
<script>
document.fonts.load('800 100px M','नींद').then(()=>{const im=new Image();im.onload=()=>{const c=document.getElementById('c').getContext('2d');c.drawImage(im,0,0,1080,1920);
c.textAlign='center';c.lineJoin='round';
const L=[['श्रीकृष्ण को भी',110,'#FFFFFF'],['श्राप मिला!!!',180,'#FFE14D'],['और वो सच हुआ',110,'#FFFFFF']];let y=1080;const g=c.createLinearGradient(0,1300,0,1920);g.addColorStop(0,'rgba(5,6,16,0)');g.addColorStop(0.35,'rgba(5,6,16,0.97)');g.addColorStop(1,'rgba(5,6,16,1)');c.fillStyle=g;c.fillRect(0,1300,1080,620);
for(const [t,s,col] of L){c.font=`800 ${s}px M`;c.lineWidth=s*0.16;c.strokeStyle='#000';c.strokeText(t,540,y);c.fillStyle=col;c.fillText(t,540,y);y+=s*1.45}
document.title='done'};im.src='review/thumb/t1.60.jpg'})
</script></body></html>
